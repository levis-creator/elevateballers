name: Deploy to cPanel

# Builds on GitHub's Linux runner (so native packages such as sharp and resvg
# get their Linux binaries) and ships the finished release over SSH. The host
# has 1 GB of RAM, too little to run npm install or astro build itself.
#
# Server layout:
#   ~/node24/                 Node 24 (the cPanel selector stops at Node 20)
#   ~/releases/<sha>/         one folder per deploy, last 3 kept
#   ~/current -> releases/<sha>
#   ~/prod/                   Passenger app root: .htaccess, .env, tmp/, plus
#                             symlinks into ~/current. .env never leaves the server.
# The first run moves the manually deployed files in ~/prod into a
# releases/bootstrap-* folder, which becomes the rollback target.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  APP_HOST: www.elevateballers.com
  ORIGIN_IP: 102.218.215.35
  DEPLOY_TARGET: cpanel

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.CPANEL_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host cpanel
            HostName ${{ secrets.CPANEL_HOST }}
            Port ${{ secrets.CPANEL_PORT }}
            User ${{ secrets.CPANEL_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      # PUBLIC_* values are inlined at build time, so read them from the
      # server's .env instead of duplicating them in GitHub. $GITHUB_ENV keeps
      # quotes literally, so strip the ones dotenv would have removed.
      - name: Load public build variables from the server
        run: |
          ssh cpanel "grep -E '^PUBLIC_[A-Z_]+=' ~/prod/.env" \
            | sed -E "s/^([A-Z_]+)=([\"'])(.*)\2[[:space:]]*\$/\1=\3/" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Test
        # Some modules build the Prisma client on import, which needs a URL;
        # the tests mock every query, so it is never connected to.
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
        run: npm test

      - name: Build
        # Tags Sentry errors, traces and sessions with the commit they came from.
        # With SENTRY_AUTH_TOKEN set, source maps are uploaded for that release
        # and deleted from dist before packaging; without it the upload is skipped.
        env:
          PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build:cpanel

      - name: Package release
        run: |
          npm prune --omit=dev
          # src/assets/fonts is read at runtime from process.cwd() by the match
          # share image (og.png) and the stat-sheet PDF.
          tar -czf release.tar.gz dist node_modules prisma prisma.config.ts package.json server.js server.cjs src/assets/fonts

      - name: Upload release
        run: |
          ssh cpanel "mkdir -p ~/releases/${{ github.sha }}"
          scp release.tar.gz cpanel:releases/${{ github.sha }}/

      - name: Activate release
        run: |
          ssh cpanel 'bash -s' <<'EOF'
          set -euo pipefail
          SHA="${{ github.sha }}"
          REL="$HOME/releases/$SHA"

          # Node 24 runtime. The host's Node selector stops at 20, so we run our
          # own copy and move it to the newest 24.x release (security fixes)
          # whenever one is out. The tarball is checked against nodejs.org's
          # SHA-256 list, and the swap keeps ~/node24.prev for a manual revert.
          # A failed update keeps the current Node; only a missing Node fails.
          install_node() {
            local v="$1" tmp
            # Not /tmp: it is mounted noexec on this host.
            tmp=$(mktemp -d "$HOME/.node-update.XXXXXX")
            curl -fsSL "https://nodejs.org/dist/$v/node-$v-linux-x64.tar.gz" -o "$tmp/node.tgz" &&
            curl -fsSL "https://nodejs.org/dist/$v/SHASUMS256.txt" -o "$tmp/sums" &&
            (cd "$tmp" && grep " node-$v-linux-x64.tar.gz\$" sums | sed "s/node-$v-linux-x64.tar.gz/node.tgz/" | sha256sum -c --status) &&
            tar -xzf "$tmp/node.tgz" -C "$tmp" &&
            "$tmp/node-$v-linux-x64/bin/node" -v >/dev/null &&
            { rm -rf "$HOME/node24.prev"; [ -d "$HOME/node24" ] && mv "$HOME/node24" "$HOME/node24.prev"; mv "$tmp/node-$v-linux-x64" "$HOME/node24"; }
            local ok=$?
            rm -rf "$tmp"
            return $ok
          }
          LATEST=$(curl -fsSL https://nodejs.org/dist/index.json | grep -o '"version":"v24[^"]*"' | head -1 | cut -d'"' -f4 || true)
          CURRENT=$("$HOME/node24/bin/node" -v 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" != "$CURRENT" ]; then
            if install_node "$LATEST"; then echo "Node $CURRENT -> $LATEST"; else echo "Node update to $LATEST failed; keeping ${CURRENT:-none}"; fi
          fi
          [ -x "$HOME/node24/bin/node" ] || { echo "Node 24 is not installed"; exit 1; }

          cd "$REL"
          tar -xzf release.tar.gz && rm release.tar.gz

          # Pages already open in a browser, or cached, still ask for the old
          # release's hashed chunks; without them islands fail to hydrate
          # ("Failed to fetch dynamically imported module"). Carry over chunks
          # built in the last 7 days as hard links (hashed names never clash,
          # and existing files are never overwritten).
          LIVE_ASSETS="$(readlink -f "$HOME/current" 2>/dev/null || true)/dist/client/_astro"
          if [ -d "$LIVE_ASSETS" ] && [ -d dist/client/_astro ]; then
            (cd "$LIVE_ASSETS" && find . -type f -mtime -7 -print0) |
              (cd "$LIVE_ASSETS" && xargs -0 -r cp -nl --parents -t "$REL/dist/client/_astro/") || true
          fi

          FILES="dist node_modules prisma prisma.config.ts package.json server.js server.cjs src"

          # First run: ~/prod still holds real files from the manual deploy.
          # Move them into a bootstrap release so they become the rollback target.
          if [ ! -L "$HOME/current" ]; then
            BOOT="$HOME/releases/bootstrap-$(date +%Y%m%d%H%M%S)"
            mkdir -p "$BOOT"
            for f in $FILES; do
              [ -e "$HOME/prod/$f" ] && [ ! -L "$HOME/prod/$f" ] && mv "$HOME/prod/$f" "$BOOT/$f"
            done
            ln -sfn "$BOOT" "$HOME/current"
          fi

          # Remember the live release so a failed smoke test can roll back.
          readlink "$HOME/current" > "$HOME/releases/.previous"
          ln -sfn "$REL" "$HOME/current"

          # ~/prod/.htaccess and ~/public_html/.htaccess both point Passenger at
          # ~/prod and already use Node 24 + server.js; neither is touched here.
          cd "$HOME/prod"
          for f in $FILES; do
            [ -L "$f" ] || [ ! -e "$f" ] || { echo "$f is not a symlink, refusing to replace it"; exit 1; }
            ln -sfn "$HOME/current/$f" "$f"
          done

          mkdir -p tmp && touch tmp/restart.txt

          # Keep the 3 newest releases.
          ls -1dt "$HOME"/releases/*/ | tail -n +4 | xargs -r rm -rf
          EOF

      - name: Smoke test
        id: smoke
        run: |
          for i in 1 2 3 4 5 6; do
            # Hit the origin directly: Cloudflare may challenge scripted requests.
            code=$(curl -sk --resolve "$APP_HOST:443:$ORIGIN_IP" -o /dev/null -w '%{http_code}' "https://$APP_HOST/robots.txt" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1

      - name: Roll back on failure
        # Only after a live release failed its check; earlier failures never touched the server.
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          ssh cpanel 'bash -s' <<'EOF'
          PREV=$(cat "$HOME/releases/.previous" 2>/dev/null || true)
          if [ -n "$PREV" ] && [ -d "$PREV" ]; then
            ln -sfn "$PREV" "$HOME/current"
            touch "$HOME/prod/tmp/restart.txt"
            echo "Rolled back to $PREV"
          else
            echo "No previous release to roll back to"
          fi
          EOF
